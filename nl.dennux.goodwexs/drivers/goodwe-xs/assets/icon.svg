<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Wall mount bracket -->
  <rect x="42" y="10" width="16" height="6" rx="1.5" fill="#000000"/>

  <!-- Inverter body -->
  <rect x="22" y="16" width="56" height="70" rx="6" fill="#000000"/>

  <!-- Display / label area -->
  <rect x="30" y="25" width="40" height="16" rx="2" fill="#FFFFFF"/>
  <line x1="35" y1="31" x2="55" y2="31" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="35" y1="36" x2="48" y2="36" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Status LED -->
  <circle cx="64" cy="33" r="3" fill="#FFFFFF"/>

  <!-- Cooling vents -->
  <line x1="30" y1="52" x2="70" y2="52" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="59" x2="70" y2="59" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="66" x2="70" y2="66" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="73" x2="70" y2="73" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- WiFi / LAN Kit signal -->
  <g fill="none" stroke="#000000" stroke-width="3.4" stroke-linecap="round">
    <path d="M 63 6 A 16 16 0 0 1 89 6"/>
    <path d="M 69 12 A 8 8 0 0 1 83 12"/>
  </g>
  <circle cx="76" cy="18" r="3" fill="#000000"/>
</svg>
